name: Release

# Builds installers for Windows, macOS (universal) and Linux and attaches
# them to a GitHub Release whenever a version tag (v*) is pushed.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            platform: windows-latest
            args: ""
            rust-targets: ""
          - name: macOS
            platform: macos-latest
            args: "--target universal-apple-darwin"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - name: Linux
            platform: ubuntu-22.04
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Run Rust tests
        if: matrix.platform != 'macos-latest'
        working-directory: src-tauri
        run: cargo test --locked

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: AnyFile v__VERSION__
          releaseBody: |
            Download the installer for your platform below.

            - **Windows**: `.exe` (installer) or `.msi`
            - **macOS**: `.dmg` (Apple Silicon and Intel)
            - **Linux**: `.AppImage`, `.deb` or `.rpm`

            Optional engines for more formats: LibreOffice, Pandoc, FFmpeg.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
